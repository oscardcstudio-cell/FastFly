<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mouche · réglages</title>
<style>
  /* same look as the /stage and /trace panels */
  html, body { margin: 0; background: #000; font: 12px system-ui, sans-serif; color: #9ab; }
  #panel { padding: 14px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 74px 1fr 38px; gap: 8px; align-items: center; }
  .row output { color: #cde; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  #says { color: #fff; font-weight: 600; font-size: 14px; }
  #senses { display: grid; gap: 6px; }
  #senses div { display: flex; gap: 6px; align-items: center; }
  #senses span { flex: 1; color: #cde; } #senses small { color: #678; margin-left: 8px; }
  #senses button { font: inherit; width: 34px; background: #0b1520; color: #cde; border: 1px solid #345; border-radius: 4px; padding: 5px 0; cursor: pointer; transition: background .6s, color .6s; }
  #senses button.on { background: #3cf; color: #000; transition: none; }
  .meter { height: 6px; background: #112; } .meter i { display: block; height: 100%; width: 0; background: #3cf; }
</style>
</head>
<body>
<div id="panel">
  <div id="says">—</div>
  <div class="meter"><i id="level"></i></div>
  <canvas id="eq" style="width:100%;height:56px;display:block;background:#060c14"></canvas>
  <div id="rows"></div>
  <div id="senses"></div>
</div>
<script src="/static/eq.js"></script>
<script>
// One row per engine knob: [key sent to the server, label, min, max, step]
const KNOBS = [
  ['audio_gain', 'Gain son', 0, 4, 0.05],
  ['fly_step', 'Seuil marche', 0.5, 8, 0.5], // fly_says: how far (dB) a bar of the bass neurons must move from the 4 before to change section
  ['weight_gain', 'Réactivité', 0.5, 1, 0.01],
  ['adapt', 'Fatigue', 0, 1, 0.05],
  ['noise_amp', 'Bruit de fond', 0, 0.5, 0.01],
  ['heat_gain', 'Chaleur', 0, 1.5, 0.05],
  ['cold_gain', 'Froid', 0, 1.5, 0.05],
  ['loom_gain', 'Vision approche', 0, 2, 0.05],
];
const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
fetch('/api/params').then(r => r.json()).then(now => {
  for (const [key, label, min, max, step] of KNOBS) {
    now[key] = +now[key].toFixed(2); // float32 on the server: 0.15 comes back as 0.15000000596
    document.getElementById('rows').insertAdjacentHTML('beforeend',
      `<div class="row"><span>${label}</span><input type="range" id="${key}" min="${min}" max="${max}" step="${step}" value="${now[key]}"><output id="o-${key}">${now[key]}</output></div>`);
    document.getElementById(key).oninput = e => {
      document.getElementById('o-' + key).textContent = e.target.value;
      ws.send(JSON.stringify({ cmd: 'set_param', key, value: +e.target.value }));
    };
  }
});
// One button per sense: lights when the sequencer fires it, click fires it by hand
const senseBtn = {};
const flash = name => { const b = senseBtn[name]; if (!b) return; b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 150); };
fetch('/api/senses').then(r => r.json()).then(list => list.filter(s => s.taps[0].amplitude != null).forEach(s => { // the ear has no tap: it hears the music
  const cell = document.createElement('div');
  cell.innerHTML = `<span>${s.label}<small>${s.when}</small></span>`;
  s.taps.forEach((t, i) => {
    const b = senseBtn[t.name] = document.createElement('button');
    b.textContent = s.taps.length > 1 ? 'GD'[i] : '●';
    b.onclick = () => { ws.send(JSON.stringify({ cmd: 'tap', ...t })); flash(t.name); };
    cell.appendChild(b);
  });
  document.getElementById('senses').appendChild(cell);
}));
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'beatgrid') flash(m.sense);
  if (m.type === 'audio_levels' && m.spectrum) drawEQ(document.getElementById('eq'), m.spectrum, m.levels.HEAT, m.levels.COLD);
  if (m.type !== 'metrics' || !m.fly_says) return;
  document.getElementById('says').textContent = (m.fly_says.verdict || '—').toUpperCase();
  document.getElementById('level').style.width = (m.fly_says.level * 100) + '%';
};
</script>
</body>
</html>
